<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="816" viewBox="0 0 1440 816" role="img" aria-label="The analysis window is an algorithm."><defs><radialGradient id="ambient"><stop offset="0%" stop-color="#225843" stop-opacity=".24"/><stop offset="100%" stop-color="#0A0F0E" stop-opacity="0"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#31433B" stroke-opacity=".12" stroke-width="1"/></pattern></defs><rect width="1440" height="816" fill="#0A0F0E"/><ellipse cx="740" cy="335" rx="700" ry="400" fill="url(#ambient)"/><rect width="1440" height="816" fill="url(#grid)"/><rect x="36" y="30" width="1368" height="756" rx="18" fill="none" stroke="#273B32"/><text x="68" y="78" fill="#83DDB9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" letter-spacing="3">ALGORITHM / CONTEXT RESOLUTION</text><text x="68" y="125" fill="#EFECE2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="650" >The analysis window is an algorithm.</text><text x="70" y="155" fill="#789187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" >Backward structural searches and coordinate-safe windows replace a naive fixed-number candle lookback.</text><rect x="64" y="190" width="1312" height="329" rx="15" fill="#0E1714" stroke="#2B483C" stroke-width="1.3" /><text x="89" y="225" fill="#789187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.1">HISTORICAL PREFIX  •  ILLUSTRATIVE PRICE GEOMETRY</text><polyline points="88,326 144,306 205,333 265,288 318,301 371,279 423,335 472,302 530,388 570,360 628,343 684,279 734,296 790,249 850,273 910,234 972,270 1032,218 1088,257 1140,226 1202,251 1263,208 1350,238" fill="none" stroke="#8BC9B0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="265" y1="242" x2="265" y2="400" stroke="#83DDB9" stroke-width="1.3" stroke-dasharray="5 5"/><circle cx="265" cy="288" r="4.7" fill="#83DDB9"/><text x="228" y="419" fill="#83DDB9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" >PRE START</text><line x1="423" y1="242" x2="423" y2="400" stroke="#D8C28A" stroke-width="1.3" stroke-dasharray="5 5"/><circle cx="423" cy="335" r="4.7" fill="#D8C28A"/><text x="386" y="460" fill="#D8C28A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" >CP BREAK</text><line x1="530" y1="242" x2="530" y2="400" stroke="#83DDB9" stroke-width="1.3" stroke-dasharray="5 5"/><circle cx="530" cy="388" r="4.7" fill="#83DDB9"/><text x="493" y="419" fill="#83DDB9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" >PUSH START</text><line x1="850" y1="242" x2="850" y2="400" stroke="#98A8C3" stroke-width="1.3" stroke-dasharray="5 5"/><circle cx="850" cy="273" r="4.7" fill="#98A8C3"/><text x="813" y="460" fill="#98A8C3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" >CP START</text><line x1="1350" y1="242" x2="1350" y2="400" stroke="#EFECE2" stroke-width="1.3" stroke-dasharray="5 5"/><circle cx="1350" cy="238" r="4.7" fill="#EFECE2"/><text x="1275" y="419" fill="#EFECE2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" >AS OF</text><text x="93" y="498" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >The algorithm walks back to structural breaks; if exact evidence is unavailable, fallback provenance is retained.</text><text x="65" y="568" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" >FULL AVAILABLE PREFIX</text><rect x="405" y="543" width="952" height="29" rx="5" fill="#14211C" stroke="#293E34" stroke-width="1.3" /><rect x="405" y="543" width="952" height="29" rx="5" fill="#2B3C35" stroke="none" stroke-width="1.3" /><text x="65" y="617" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" >PRE / LIQUIDITY WINDOW</text><rect x="405" y="592" width="952" height="29" rx="5" fill="#14211C" stroke="#293E34" stroke-width="1.3" /><rect x="405" y="592" width="952" height="29" rx="5" fill="#36705A" stroke="none" stroke-width="1.3" /><text x="65" y="666" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" >STRUCTURE / POST WINDOW</text><rect x="405" y="641" width="952" height="29" rx="5" fill="#14211C" stroke="#293E34" stroke-width="1.3" /><rect x="531" y="641" width="826" height="29" rx="5" fill="#71C8A3" stroke="none" stroke-width="1.3" /><text x="65" y="715" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" >POI WINDOW (MODE-DEPENDENT)</text><rect x="405" y="690" width="952" height="29" rx="5" fill="#14211C" stroke="#293E34" stroke-width="1.3" /><rect x="422" y="690" width="935" height="29" rx="5" fill="#8D9BAE" stroke="none" stroke-width="1.3" /><text x="66" y="778" fill="#789187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" >Windows differ by analysis mode; indices are rebased across full, structure, POI, analysis and plot coordinates.</text></svg>