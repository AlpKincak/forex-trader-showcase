<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="752" viewBox="0 0 1440 752" role="img" aria-label="One analytical core; multiple ways to observe it."><defs><radialGradient id="ambient"><stop offset="0%" stop-color="#225843" stop-opacity=".24"/><stop offset="100%" stop-color="#0A0F0E" stop-opacity="0"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#31433B" stroke-opacity=".12" stroke-width="1"/></pattern></defs><rect width="1440" height="752" fill="#0A0F0E"/><ellipse cx="740" cy="335" rx="700" ry="400" fill="url(#ambient)"/><rect width="1440" height="752" fill="url(#grid)"/><rect x="36" y="30" width="1368" height="692" rx="18" fill="none" stroke="#273B32"/><text x="68" y="78" fill="#83DDB9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" letter-spacing="3">ENGINEERING / EXECUTION BOUNDARIES</text><text x="68" y="125" fill="#EFECE2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="650" >One analytical core; multiple ways to observe it.</text><text x="70" y="155" fill="#789187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" >Live operation and historical replay share a decision-time-aware strategy boundary; presentation and delivery remain downstream.</text><rect x="65" y="193" width="430" height="245" rx="14" fill="#101917" stroke="#2B3C35" stroke-width="1.3" /><text x="89" y="232" fill="#83DDB9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" >LIVE OBSERVER</text><text x="89" y="277" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" >OANDA practice candles and quote stream</text><text x="89" y="313" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" >Closed-candle scheduler + temporal proof</text><text x="89" y="349" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" >Local / hosted runtime adapters</text><text x="89" y="385" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" >No execution or order-management API</text><rect x="65" y="465" width="430" height="204" rx="14" fill="#101917" stroke="#2B3C35" stroke-width="1.3" /><text x="89" y="503" fill="#98A8C3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" >HISTORICAL REPLAY</text><text x="89" y="545" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Persisted historical prefixes</text><text x="89" y="577" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Explicit decision-time / as-of cutoff</text><text x="89" y="609" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Stable reconstruction and invariants</text><text x="89" y="641" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Certification: conditional; data gate open? NO</text><path d="M494 320H555V392H626" stroke="#83DDB9" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M494 565H554V405H626" stroke="#98A8C3" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="627" y="286" width="358" height="235" rx="12" fill="#14271E" stroke="#4C896B" stroke-width="1.3" /><text x="656" y="331" fill="#EFECE2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" >SHARED ANALYZER</text><line x1="656" y1="350" x2="956" y2="350" stroke="#5EBA96" stroke-width="1.3" /><text x="656" y="384" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Canonical OHLC + as-of availability</text><text x="656" y="418" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Window, structure, POI and liquidity</text><text x="656" y="452" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >D1 / H4 / M15 → M5 / M1</text><text x="656" y="486" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Deterministic result and provenance</text><path d="M985 403H1055" stroke="#83DDB9" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M1043 395L1056 403L1043 411" stroke="#83DDB9" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="1056" y="193" width="319" height="476" rx="14" fill="#101917" stroke="#2B3C35" stroke-width="1.3" /><text x="1078" y="234" fill="#83DDB9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" >OBSERVABLE OUTPUTS</text><rect x="1077" y="262" width="276" height="103" rx="10" fill="#18251F" stroke="#365447" stroke-width="1.3" /><text x="1094" y="295" fill="#EFECE2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" >LIVE SNAPSHOT / PWA</text><text x="1094" y="322" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" >Read-only charts, zones</text><text x="1094" y="344" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" >and model progression</text><rect x="1077" y="385" width="276" height="103" rx="10" fill="#18251F" stroke="#365447" stroke-width="1.3" /><text x="1094" y="418" fill="#EFECE2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" >EVENTS + NOTIFICATIONS</text><text x="1094" y="445" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" >SQLite outbox · Web Push</text><text x="1094" y="467" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" >Pushover policy / dedupe</text><rect x="1077" y="508" width="276" height="103" rx="10" fill="#18251F" stroke="#365447" stroke-width="1.3" /><text x="1094" y="541" fill="#EFECE2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" >LOCAL / RAILWAY-READY</text><text x="1094" y="568" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" >Single-operator state</text><text x="1094" y="590" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" >hosting infrastructure</text><text x="67" y="710" fill="#789187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" >Validation targets chronology, determinism, state equivalence and replay integrity; none implies statistically proven trading edge.</text></svg>