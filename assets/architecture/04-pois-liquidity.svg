<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="730" viewBox="0 0 1440 730" role="img" aria-label="POIs carry identity; liquidity carries context."><defs><radialGradient id="ambient"><stop offset="0%" stop-color="#225843" stop-opacity=".24"/><stop offset="100%" stop-color="#0A0F0E" stop-opacity="0"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#31433B" stroke-opacity=".12" stroke-width="1"/></pattern></defs><rect width="1440" height="730" fill="#0A0F0E"/><ellipse cx="740" cy="335" rx="700" ry="400" fill="url(#ambient)"/><rect width="1440" height="730" fill="url(#grid)"/><rect x="36" y="30" width="1368" height="670" rx="18" fill="none" stroke="#273B32"/><text x="68" y="78" fill="#83DDB9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" letter-spacing="3">STRATEGY / ZONES + LIQUIDITY</text><text x="68" y="125" fill="#EFECE2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="650" >POIs carry identity; liquidity carries context.</text><text x="70" y="155" fill="#789187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" >Zones are structurally derived; liquidity is evaluated relative to each zone's origin, windows and subsequent price path.</text><rect x="64" y="197" width="406" height="185" rx="14" fill="#101917" stroke="#2B3C35" stroke-width="1.3" /><text x="89" y="237" fill="#83DDB9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" >STRUCTURAL ORIGINS</text><line x1="88" y1="253" x2="444" y2="253" stroke="#2B3C35" stroke-width="1.3" /><text x="89" y="285" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Latest active push and its internal legs</text><text x="89" y="314" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Expansion includes multiple valid zones</text><text x="89" y="343" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Extreme · decisional ext · decisional int</text><rect x="517" y="197" width="406" height="185" rx="14" fill="#101917" stroke="#2B3C35" stroke-width="1.3" /><text x="542" y="237" fill="#98A8C3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" >ZONE PROVENANCE</text><line x1="541" y1="253" x2="897" y2="253" stroke="#2B3C35" stroke-width="1.3" /><text x="542" y="285" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Anchor candle + full [low, high]</text><text x="542" y="314" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Structural role and source region</text><text x="542" y="343" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Validity · touch · mitigation · lifecycle</text><rect x="970" y="197" width="406" height="185" rx="14" fill="#101917" stroke="#2B3C35" stroke-width="1.3" /><text x="995" y="237" fill="#D8C28A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" >PER-ZONE WINDOWS</text><line x1="994" y1="253" x2="1350" y2="253" stroke="#2B3C35" stroke-width="1.3" /><text x="995" y="285" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Pre-liquidity vs post-liquidity</text><text x="995" y="314" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Window shape depends on POI role</text><text x="995" y="343" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" >Explicit start, end and local identity</text><path d="M472 286H510" stroke="#83DDB9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M924 286H962" stroke="#83DDB9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="65" y="420" width="1310" height="201" rx="14" fill="#101A17" stroke="#2B3C35" stroke-width="1.3" /><text x="96" y="459" fill="#83DDB9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" >LIQUIDITY DETECTORS</text><rect x="95" y="478" width="298" height="79" rx="9" fill="#172520" stroke="#375044" stroke-width="1.3" /><text x="110" y="508" fill="#EFECE2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" >ASIA</text><text x="110" y="535" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" >Session high / low</text><rect x="415" y="478" width="298" height="79" rx="9" fill="#172520" stroke="#375044" stroke-width="1.3" /><text x="430" y="508" fill="#EFECE2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" >EQUAL LEVELS</text><text x="430" y="535" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" >EQH / EQL</text><rect x="735" y="478" width="298" height="79" rx="9" fill="#172520" stroke="#375044" stroke-width="1.3" /><text x="750" y="508" fill="#EFECE2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" >TRENDLINES</text><text x="750" y="535" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" >Repeated touches</text><rect x="1055" y="478" width="298" height="79" rx="9" fill="#172520" stroke="#375044" stroke-width="1.3" /><text x="1070" y="508" fill="#EFECE2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" >FAILED PULLBACK</text><text x="1070" y="535" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" >Post-window event</text><text x="95" y="588" fill="#C9D6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" >Detect → local inducement / scoring → classify reach-leg or EOP-bounce evidence → feed relevant LTF model gates</text><rect x="66" y="655" width="259" height="31" rx="7" fill="#16251F" stroke="#345748" stroke-width="1.3" /><text x="79" y="677" fill="#83DDB9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" >TOUCH / INSIDE IS INCLUSIVE</text><rect x="337" y="655" width="320" height="31" rx="7" fill="#16251F" stroke="#345748" stroke-width="1.3" /><text x="350" y="677" fill="#D8C28A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" >BREAK / INVALIDATION IS STRICT</text><text x="685" y="677" fill="#789187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" >Liquidity is inferred from price structure, not observed order-book flow.</text></svg>